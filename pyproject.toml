[project]
name = "structured-rag"
version = "0.1.0"
description = "StructuredRAG: JSON Response Formatting with Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dspy-ai==2.4.13",
    "ollama>=0.4.0",
    "matplotlib>=3.9.1",
    "google-generativeai>=0.8.6",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["structured_rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
